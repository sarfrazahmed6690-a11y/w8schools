<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - C++ Master</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        w3green: '#04AA6D',
                        w3greenDark: '#038858',
                        w3dark: '#1d1e22',
                        w3darker: '#121214',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-full bg-white dark:bg-w3darker text-gray-800 dark:text-gray-100 flex flex-col transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="h-16 bg-gray-900 text-white flex items-center justify-between px-6 shadow-md shrink-0 z-30">
        <div class="flex items-center space-x-6">
            <a href="index.html" class="flex items-center space-x-2 text-2xl font-bold tracking-wider">
                <span class="text-w3green"><i class="fa-solid fa-code"></i></span>
                <span>C++<span class="text-w3green font-light text-sm ml-1 bg-w3green/20 px-2 py-0.5 rounded">Master</span></span>
            </a>
            <nav class="hidden md:flex space-x-6 text-sm font-semibold">
                <a href="index.html" class="text-gray-300 hover:text-w3green transition-colors">Home</a>
                <a href="tutor.html" class="text-gray-300 hover:text-w3green transition-colors">Tutorial</a>
                <a href="about.html" class="text-gray-300 hover:text-w3green transition-colors">About Us</a>
                <a href="contact.html" class="text-w3green transition-colors">Contact</a>
            </nav>
        </div>
        <div class="flex items-center space-x-3">
            <button id="theme-toggle" class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white transition-colors" title="Toggle Theme">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Contact Content -->
    <main class="flex-1 overflow-y-auto px-6 py-16">
        <div class="max-w-2xl mx-auto space-y-8">
            <div class="border-b border-gray-200 dark:border-gray-800 pb-4">
                <span class="text-w3green text-xs font-bold uppercase tracking-wider">Get in Touch</span>
                <h1 class="text-4xl font-bold mt-1">Contact Us</h1>
            </div>
            <p class="text-gray-600 dark:text-gray-300">Have questions about our C++ tutorials or want to provide feedback? Send us a message below.</p>
            
            <form id="contact-form" onsubmit="handleContact(event)" class="space-y-6 bg-gray-50 dark:bg-gray-800/50 p-8 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-2">Your Name</label>
                    <input type="text" required class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-2">Email Address</label>
                    <input type="email" required class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-2">Message</label>
                    <textarea rows="4" required class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-w3green hover:bg-w3greenDark text-white font-bold py-3.5 rounded-xl transition-colors shadow">Send Message</button>
                <div id="contact-msg" class="text-center text-sm font-semibold text-w3green"></div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-8 px-6 text-center text-sm border-t border-gray-800">
        <p>&copy; 2026 C++ Master Portal. All rights reserved.</p>
    </footer>

    <script>
        function handleContact(e) {
            e.preventDefault();
            const msg = document.getElementById('contact-msg');
            msg.innerText = "Thank you! Your message has been sent successfully.";
            e.target.reset();
            setTimeout(() => { msg.innerText = ""; }, 4000);
        }

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
            themeIcon.className = "fa-solid fa-sun";
        }
        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.className = "fa-solid fa-moon";
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.className = "fa-solid fa-sun";
            }
        });
    </script>
</body>
</html>
