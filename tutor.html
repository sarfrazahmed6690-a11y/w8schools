    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        w3green: '#04AA6D',
                        w3greenDark: '#038858',
                        w3dark: '#1d1e22',
                        w3darker: '#121214',

    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'Fira Code', monospace; }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #4b5563;
        }

<body class="h-full bg-white dark:bg-w3darker text-gray-800 dark:text-gray-100 transition-colors duration-200 overflow-hidden flex flex-col">

    <!-- Header Navbar -->
    <header class="h-16 bg-gray-900 text-white flex items-center justify-between px-4 lg:px-6 shadow-md shrink-0 z-30">
        <div class="flex items-center space-x-4">
            <button id="sidebar-toggle" class="lg:hidden text-xl focus:outline-none hover:text-w3green transition-colors">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="index.html" onclick="loadTopic('home')" class="flex items-center space-x-2 text-2xl font-bold tracking-wider">
                <span class="text-w3green"><i class="fa-solid fa-code"></i></span>
                <span>C++<span class="text-w3green font-light text-sm ml-1 bg-w3green/20 px-2 py-0.5 rounded">Tutorial</span></span>
            </a>
        </div>

        <!-- Global Search Bar -->
        <div class="hidden md:flex relative flex-1 max-w-md mx-6">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa-solid fa-search"></i>
            </span>
            <input type="text" id="global-search" placeholder="Search C++ tutorials, keywords, arrays..." 
                class="w-full pl-10 pr-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-sm text-white placeholder-gray-400 focus:outline-none focus:border-w3green transition-all">
            <div id="search-dropdown" class="absolute top-full left-0 right-0 mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl max-h-80 overflow-y-auto hidden z-50"></div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Dark / Light Mode Toggle -->
            <button id="theme-toggle" class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white transition-colors" title="Toggle Theme">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <!-- Login / Sign Up Button -->
            <button id="open-auth-modal" class="bg-w3green hover:bg-w3greenDark text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow">
                <i class="fa-solid fa-user mr-1.5"></i> Sign In
            </button>
        </div>
    </header>

    <!-- Main App Container with Dual Independent Scrolling -->
    <div class="flex-1 flex overflow-hidden h-[calc(100vh-4rem)]">
        
        <!-- Left Sidebar (Independent Scrolling) -->
        <aside id="sidebar" class="w-72 bg-gray-50 dark:bg-[#1a1c23] border-r border-gray-200 dark:border-gray-800 h-full overflow-y-auto shrink-0 transition-all duration-300 z-20 flex flex-col">
            <div class="p-4 border-b border-gray-200 dark:border-gray-800 md:hidden">
                <div class="relative">
                    <input type="text" id="mobile-search" placeholder="Search..." class="w-full pl-9 pr-3 py-1.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded text-sm">

                </div>
            </div>
            <nav id="nav-menu" class="p-4 space-y-6 text-sm flex-1">

        </aside>

        <!-- Main Content Panel (Independent Scrolling) -->

            <!-- Content gets loaded here dynamically -->
        </main>
    </div>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-2xl p-6 relative transform scale-95 transition-transform duration-300" id="auth-modal-box">
            <button id="close-auth-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
                <button id="tab-signin" class="flex-1 pb-3 font-semibold text-w3green border-b-2 border-w3green transition-colors">Sign In</button>
                <button id="tab-signup" class="flex-1 pb-3 font-semibold text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">Sign Up</button>
            </div>
            
            <!-- Sign In Form -->
            <form id="form-signin" class="space-y-4" onsubmit="handleAuth(event, 'signin')">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Email Address</label>
                    <input type="email" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Password</label>
                    <input type="password" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green">
                </div>
                <button type="submit" class="w-full bg-w3green hover:bg-w3greenDark text-white font-semibold py-2.5 rounded-lg transition-colors shadow">Sign In</button>
            </form>

            <!-- Sign Up Form -->
            <form id="form-signup" class="space-y-4 hidden" onsubmit="handleAuth(event, 'signup')">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Full Name</label>
                    <input type="text" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Email Address</label>
                    <input type="email" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 mb-1">Password</label>
                    <input type="password" required class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:border-w3green">
                </div>
                <button type="submit" class="w-full bg-w3green hover:bg-w3greenDark text-white font-semibold py-2.5 rounded-lg transition-colors shadow">Create Account</button>
            </form>
            <div id="auth-msg" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </div>

                title: "C++ <cmath> Library",
                desc: "Mathematical functions library.",
                code: `#include <iostream>\n#include <cmath>\nusing namespace std;\n\nint main() {\n    cout << "Power 2^3 = " << pow(2, 3);\n    return 0;\n}`,
                explanation: [
                    "Trigonometric, logarithmic, and exponential functions."
                ]
            },
            ref_string: {
                title: "C++ <string> Library",
                desc: "Standard string class and manipulation utilities.",
                code: `#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string s = "Hello C++";\n    cout << s.substr(0, 5);\n    return 0;\n}`,
                explanation: [
                    "Dynamic text handling."
                ]
            },
            ref_cstring: {
                title: "C++ <cstring> Library",
                desc: "C-style string manipulation functions (strcpy, strlen, strcmp).",
                code: `#include <iostream>\n#include <cstring>\nusing namespace std;\n\nint main() {\n    char str[] = "Hello";\n    cout << "Length: " << strlen(str);\n    return 0;\n}`,
                explanation: [
                    "Low-level string operations on character arrays."
                ]
            },
            ref_ctime: {
                title: "C++ <ctime> Library",
                desc: "Date and time manipulation library.",
                code: `#include <iostream>\n#include <ctime>\nusing namespace std;\n\nint main() {\n    time_t t = time(0);\n    cout << "Epoch seconds: " << t;\n    return 0;\n}`,
                explanation: [
                    "Time calculations and formatting."
                ]
            },
            ref_vector: {
                title: "C++ <vector> Library",
                desc: "Dynamic array container reference.",
                code: `#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> v = {10, 20, 30};\n    cout << "Capacity: " << v.capacity();\n    return 0;\n}`,
                explanation: [
                    "Dynamic contiguous storage."
                ]
            },
            ref_algorithm: {
                title: "C++ <algorithm> Library",
                desc: "Sorting, searching, and manipulating algorithms.",
                code: `#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    vector<int> v = {4, 1, 8, 3};\n    auto min_el = min_element(v.begin(), v.end());\n    cout << "Min element: " << *min_el;\n    return 0;\n}`,
                explanation: [
                    "Powerful generic algorithms for STL containers."
                ]
            }
        };

        // Render Sidebar Navigation
        function renderSidebar() {
            const navMenu = document.getElementById('nav-menu');
            let html = '';

            tutorials.forEach(cat => {
                html += `<div class="space-y-1">`;
                html += `<div class="font-bold text-xs uppercase text-gray-400 dark:text-gray-500 tracking-wider mb-2">${cat.category}</div>`;
                cat.items.forEach(item => {
                    html += `<a href="#" onclick="loadTopic('${item.id}')" data-id="${item.id}" class="nav-item block px-3 py-1.5 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors font-medium">${item.title}</a>`;
                });
                html += `</div>`;
            });

            navMenu.innerHTML = html;
        }

        // Find previous and next topic IDs for navigation buttons
        function getPrevNext(currentId) {
            let flatList = [];
            tutorials.forEach(cat => {
                cat.items.forEach(item => flatList.push(item.id));
            });
            let index = flatList.indexOf(currentId);
            return {
                prev: index > 0 ? flatList[index - 1] : null,
                next: index < flatList.length - 1 ? flatList[index + 1] : null
            };
        }

        // Load Topic Content into Main Panel
        function loadTopic(id) {
            const data = contentData[id] || contentData['home'];
            const panel = document.getElementById('main-content-panel');
            const navItems = document.querySelectorAll('.nav-item');
            
            // Highlight active sidebar item
            navItems.forEach(el => {
                if(el.getAttribute('data-id') === id) {
                    el.classList.add('bg-w3green', 'text-white', 'dark:bg-w3green');
                    el.classList.remove('text-gray-700', 'dark:text-gray-300', 'hover:bg-gray-200', 'dark:hover:bg-gray-800');
                } else {
                    el.classList.remove('bg-w3green', 'text-white', 'dark:bg-w3green');
                    el.classList.add('text-gray-700', 'dark:text-gray-300', 'hover:bg-gray-200', 'dark:hover:bg-gray-800');
                }
            });

            const navLinks = getPrevNext(id);

            panel.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-8 pb-12 animate-fadeIn">
                    <!-- Breadcrumbs & Title -->
                    <div class="border-b border-gray-200 dark:border-gray-800 pb-4">
                        <span class="text-w3green text-xs font-bold uppercase tracking-wider">C++ Tutorial</span>
                        <h1 class="text-3xl md:text-4xl font-bold mt-1">${data.title}</h1>
                    </div>

                    <!-- Description -->
                    <p class="text-lg text-gray-600 dark:text-gray-300 leading-relaxed">${data.desc}</p>

                    <!-- Explanation Points -->
                    <div class="space-y-3 bg-gray-50 dark:bg-[#252833] p-6 rounded-xl border border-gray-200 dark:border-gray-700">
                        <h3 class="font-bold text-lg mb-2 text-w3green"><i class="fa-solid fa-circle-check mr-2"></i>Key Concepts</h3>
                        <ul class="list-disc list-inside space-y-2 text-gray-700 dark:text-gray-300">
                            ${data.explanation.map(exp => `<li>${exp}</li>`).join('')}
                        </ul>
                    </div>

                    <!-- Try it Yourself Interactive Code Editor -->
                    <div class="bg-gray-900 rounded-xl overflow-hidden shadow-2xl border border-gray-800">
                        <div class="bg-gray-800 px-4 py-3 flex items-center justify-between border-b border-gray-700">
                            <div class="flex items-center space-x-2">
                                <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                                <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                                <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                                <span class="text-xs text-gray-400 font-mono ml-2">main.cpp</span>
                            </div>
                            <button onclick="runCode('${id}')" class="bg-w3green hover:bg-w3greenDark text-white px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow flex items-center space-x-1.5">
                                <i class="fa-solid fa-play"></i><span>Run Code ❯</span>
                            </button>
                        </div>
                        <div class="p-4 bg-gray-950">
                            <textarea id="code-${id}" class="w-full h-48 bg-transparent text-green-400 font-mono text-sm resize-none focus:outline-none" spellcheck="false">${data.code}</textarea>
                        </div>
                        <div class="bg-gray-900 border-t border-gray-800 p-4">
                            <div class="text-xs font-bold uppercase text-gray-400 mb-1">Simulated Output:</div>
                            <div id="output-${id}" class="bg-black/50 p-3 rounded font-mono text-sm text-gray-300 min-h-[3rem] whitespace-pre-wrap border border-gray-800">Click "Run Code ❯" to execute program...</div>
                        </div>
                    </div>

                    <!-- Prev / Next Navigation Buttons -->
                    <div class="flex items-center justify-between pt-6 border-t border-gray-200 dark:border-gray-800">
                        <button ${navLinks.prev ? `onclick="loadTopic('${navLinks.prev}')"` : 'disabled'} class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Previous
                        </button>
                        <button ${navLinks.next ? `onclick="loadTopic('${navLinks.next}')"` : 'disabled'} class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-w3green hover:bg-w3greenDark text-white disabled:opacity-40 disabled:cursor-not-allowed transition-colors shadow">
                            Next <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            `;
            // Scroll main panel back to top
            panel.scrollTop = 0;
            // Close mobile sidebar if open
            document.getElementById('sidebar').classList.add('-translate-x-full', 'lg:translate-x-0', 'absolute', 'lg:relative');
        }

        // Simulate C++ Code Execution
        function runCode(id) {
            const codeEl = document.getElementById(`code-${id}`);
            const outputEl = document.getElementById(`output-${id}`);
            const code = codeEl.value;

            outputEl.innerHTML = '<span class="text-yellow-400 animate-pulse">Compiling and executing...</span>';
            
            setTimeout(() => {
                // Basic pattern matching simulation for interactive educational feedback
                let simOutput = "";
                if (code.includes('cout')) {
                    // Extract strings inside cout << "..."
                    let matches = code.match(/cout\s*<<\s*"([^"]*)"/g);
                    if (matches) {
                        matches.forEach(m => {
                            let text = m.match(/"([^"]*)"/)[1];
                            simOutput += text + "\n";
                        });
                    }
                    let varMatches = code.match(/cout\s*<<\s*([a-zA-Z0-9_]+)/g);
                    if (varMatches && !simOutput) {
                        simOutput = "42\n";
                    }
                }
                if (!simOutput) {
                    simOutput = "Program executed successfully with exit code 0.";
                }
                outputEl.innerHTML = simOutput.trim();
            }, 400);
        }

        // Real-time Global Search Functionality
        const globalSearch = document.getElementById('global-search');
        const mobileSearch = document.getElementById('mobile-search');
        const searchDropdown = document.getElementById('search-dropdown');

        function handleSearchInput(e) {
            const query = e.target.value.toLowerCase().trim();
            if(!query) {
                searchDropdown.classList.add('hidden');
                return;
            }

            let results = [];
            tutorials.forEach(cat => {
                cat.items.forEach(item => {
                    if(item.title.toLowerCase().includes(query) || item.id.includes(query)) {
                        results.push(item);
                    }
                });
            });

            if(results.length > 0) {
                searchDropdown.innerHTML = results.map(r => `
                    <div onclick="loadTopic('${r.id}'); searchDropdown.classList.add('hidden');" class="px-4 py-2.5 hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer text-sm font-medium border-b border-gray-100 dark:border-gray-700 last:border-b-0">
                        ${r.title}
                    </div>
                `).join('');
                searchDropdown.classList.remove('hidden');
            } else {
                searchDropdown.innerHTML = `<div class="px-4 py-3 text-sm text-gray-500">No tutorials found matching "${query}"</div>`;
                searchDropdown.classList.remove('hidden');
            }
        }

        globalSearch.addEventListener('input', handleSearchInput);
        mobileSearch.addEventListener('input', handleSearchInput);

        // Hide search dropdown on outside click
        document.addEventListener('click', (e) => {
            if(!globalSearch.contains(e.target) && !searchDropdown.contains(e.target)) {
                searchDropdown.classList.add('hidden');
            }
        });

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        // Check local storage or system preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
            themeIcon.className = "fa-solid fa-sun";
        } else {
            htmlElement.classList.remove('dark');
            themeIcon.className = "fa-solid fa-moon";
        }

        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.className = "fa-solid fa-moon";
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.className = "fa-solid fa-sun";
            }
        });

        // Sidebar Mobile Toggle
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('absolute');
            sidebar.classList.toggle('z-40');
        });

        // Authentication Modal Logic
        const authModal = document.getElementById('auth-modal');
        const authModalBox = document.getElementById('auth-modal-box');
        const openAuthModal = document.getElementById('open-auth-modal');
        const closeAuthModal = document.getElementById('close-auth-modal');
        const tabSignin = document.getElementById('tab-signin');
        const tabSignup = document.getElementById('tab-signup');
        const formSignin = document.getElementById('form-signin');
        const formSignup = document.getElementById('form-signup');
        const authMsg = document.getElementById('auth-msg');

        openAuthModal.addEventListener('click', () => {
            authModal.classList.remove('hidden');
            setTimeout(() => {
                authModal.classList.remove('opacity-0');
                authModalBox.classList.remove('scale-95');
            }, 10);
        });

        function closeModal() {
            authModal.classList.add('opacity-0');
            authModalBox.classList.add('scale-95');
            setTimeout(() => {
                authModal.classList.add('hidden');
                authMsg.innerText = '';
            }, 300);
        }

        closeAuthModal.addEventListener('click', closeModal);
        authModal.addEventListener('click', (e) => {
            if(e.target === authModal) closeModal();
        });

        tabSignin.addEventListener('click', () => {
            tabSignin.className = "flex-1 pb-3 font-semibold text-w3green border-b-2 border-w3green transition-colors";
            tabSignup.className = "flex-1 pb-3 font-semibold text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors";
            formSignin.classList.remove('hidden');
            formSignup.classList.add('hidden');
            authMsg.innerText = '';
        });

        tabSignup.addEventListener('click', () => {
            tabSignup.className = "flex-1 pb-3 font-semibold text-w3green border-b-2 border-w3green transition-colors";
            tabSignin.className = "flex-1 pb-3 font-semibold text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors";
            formSignup.classList.remove('hidden');
            formSignin.classList.add('hidden');
            authMsg.innerText = '';
        });

        function handleAuth(event, type) {
            event.preventDefault();
            authMsg.className = "mt-4 text-center text-sm font-medium text-w3green animate-pulse";
            authMsg.innerText = type === 'signin' ? "Signing in successfully..." : "Account created successfully!";
            setTimeout(() => {
                closeModal();
                openAuthModal.innerHTML = '<i class="fa-solid fa-user-check mr-1.5"></i> My Account';
            }, 1200);
        }

        // Initialize application on load
        window.onload = function() {
            renderSidebar();
            loadTopic('home');
        };
    </script>
</body>
</html>
